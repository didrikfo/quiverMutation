[project]
name = "quivermutation"
version = "0.1.0"
description = "Tools for mutating quivers with relations and working with their path algebras."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Didrik Fosse" }]

dependencies = [
  "matplotlib>=3.9",
  "networkx>=3.3",
  "numpy>=2.1",
  "polars>=1.7",
  "sympy>=1.13",
]

[project.optional-dependencies]
test = ["pytest>=8.3"]

[tool.setuptools]
packages = ["quivermutation"]
py-modules = ["classify", "classes", "discover", "families", "merges", "overlaps", "overnight", "probe"]

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: runs a full mutation class search; takes tens of seconds or more",
]
