[project]
name = "quivermutation"
version = "0.1.0"
description = "Tools for mutating quivers with relations and working with their path algebras."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Didrik Fosse" }]

dependencies = [
  "matplotlib>=3.9",
  "networkx>=3.3",
  "numpy>=2.1",
  "sympy>=1.13",
]

[project.optional-dependencies]
test = ["pytest>=8.3"]

[tool.setuptools]
py-modules = ["quiverMutation", "pathAlgebraClass", "quiverExamples", "main"]

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
